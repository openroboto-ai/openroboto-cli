# Running the CLI in a container. **Optional** -- `pip install openroboto` is the
# main path; this file is for people who would rather not touch the host's Python
# environment.
#
#
# The training container is started by this container **through the host's
# Docker** (red line #2: openpi needs numpy<2.0 and bittensor needs numpy>=2.0,
# and one interpreter cannot hold both), which is why docker.sock is mounted.
# ⚠️ Mounting docker.sock hands this container root on the host. Only do this on
# a machine you own.
services:
  # Default service: training. **Spends nothing**, safe to re-run.
  train:
    build:
      context: .
    image: openroboto-cli:latest
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ./miner.yaml:/app/miner.yaml:ro
      - ./state:/app/state            # checkpoint: submit resumes from it and reuses a fee already paid
      - ./cache:/app/cache            # base-checkpoint cache, avoids re-downloading several GB each round
      - openroboto-logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["train", "--config", "miner.yaml"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The pre-spend self-check. Needs no GPU, run it as often as you like.
  doctor:
    image: openroboto-cli:latest
    volumes:
      - ./miner.yaml:/app/miner.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["doctor", "--config", "miner.yaml"]
    profiles: ["tools"]

  # Validate the checkpoint format locally -- still free, the last gate before
  # anything is paid.
  check:
    image: openroboto-cli:latest
    volumes:
      - ./miner.yaml:/app/miner.yaml:ro
      - ./state:/app/state
    command: ["check"]
    profiles: ["tools"]

# ⚠️ There is deliberately **no** submit service. (`burn` and `announce` are not
# commands at all since 1.0 -- they are steps of `submit`.) `submit` spends an
# entry fee that is not refundable, and a compose service is easily pulled in by
# a stray `up` or re-run by a restart policy. To submit, type the one-off command
# explicitly and watch it finish:
#
#   docker compose run --rm train submit --config miner.yaml
#
volumes:
  openroboto-logs:
