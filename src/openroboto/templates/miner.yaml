# OpenRoboto — miner configuration
#
# Written by `openroboto init`. Runtime parameters come from this file plus the
# subnet's public control.json. No environment-variable fallback: what you see
# here is what the CLI uses.

# ─── Which subnet and backend ───────────────────────────────
# **This block was written to match the backend `openroboto init` asked**, and
# not from a template: the season below came from that backend, so the chain the
# fee is burned on has to come from there too.
#
# `mainnet` = netuid 80 on finney, real TAO, non-refundable fees.
# `dev`     = netuid 313 on testnet, faucet TAO, nothing to lose.
# `local`   = your own backend, wherever it runs. `init --backend-url <address>`
#             fills in backend.url, urls.control_json and the netuid that
#             backend says it watches — but a netuid does not say which chain it
#             is on, and nothing else can answer that for you, so subnet.network
#             below is left empty and every on-chain command refuses until you
#             set it (`test` for a testnet backend, `finney` for a mainnet one).
#
# This one name covers four settings that must agree: subnet.network,
# subnet.netuid, urls.control_json and backend.url. Changing only some of them
# is how you burn mainnet TAO at the dev fee rate, or submit to testnet and then
# ask production why nothing showed up. Anything below can still be overridden
# individually — the CLI just refuses to run on chain when the pieces disagree.
environment: $environment

# ─── Bittensor subnet ───────────────────────────────────────
subnet:
  network: $network                  # finney (mainnet) | test | local
  netuid: $netuid                       # the subnet this workspace mines. Required —
                                   # the CLI refuses to touch the chain without
                                   # it, because a wrong netuid burns real TAO on
                                   # the wrong subnet.
  subtensor_endpoint: ""           # optional WS endpoint override
  wallet_path: ""                  # empty = Bittensor SDK default (~/.bittensor/wallets)
  coldkey: default
  hotkey: default
  hotkey_ss58: ""                  # your hotkey SS58 address; the HF repo name
                                   # is derived from its last 12 characters
  wallet_password: ""              # optional; set it to skip the interactive prompt.
                                   # Never commit this file with a password in it.

# ─── Public HTTP resources ──────────────────────────────────
urls:
  control_json: "$control_json"

# ─── Backend API ────────────────────────────────────────────
# The backend that served the competition below, written down instead of left to
# a default. Left out, every later command asks the built-in default, which is
# **production** — so a workspace initialised against any other backend would
# train for one season and pay for another.
backend:
  url: "$backend_url"
  dataset_train: "https://api.openroboto.ai/train.json"
  dataset_val: "https://api.openroboto.ai/val.json"

# ─── Competition ────────────────────────────────────────────
# Which competition this workspace mines. **`openroboto init` fills this in**
# from the season you picked, and `openroboto init --refresh` rewrites it (and
# only it -- everything else in this file is left byte for byte as you left it,
# and the previous version is kept as miner.yaml.bak).
#
# Everything about a season lives here, so `build` / `train` / `check` never
# have to go online: which image to build, which starting script, which
# checkpoint layout your model is judged by (pi0.5 and LingBot-VLA 2.0 accept
# completely different trees), and what the entry fee is.
#
# Left empty, everything is judged as the pi0.5 simulation competition, exactly
# as it was before there was more than one competition.
#
# ⚠️ Do not hand-edit `params.fee`. It is confirmed against the backend in the
# moment before you pay, and a value edited here only ever produces a refusal.
competition:
  adapter: ""                      # sim_openpi | sim_lingbot | real_xarm6
  params: {}                       # the season's own spec (fee, base model,
                                   # image, format rules) as announced

# ─── Model ──────────────────────────────────────────────────
model:
  vla_model_id: pi05
  vla_checkpoint_path: ""          # empty = the training container downloads
                                   # gs://openpi-assets/checkpoints/pi05_base itself
                                   # into ./cache/pi05_base, reused next round

# ─── HuggingFace ────────────────────────────────────────────
huggingface:
  token: ""                        # write token; required by `openroboto upload`
  username: ""                     # your HF account name

# ─── Training ───────────────────────────────────────────────
custom_train_script: "train_strategy.py"   # mounted into the container as
                                           # /data/scripts/<name>, entry point
                                           # train(cfg, episodes, policy)

# ─── Logging ────────────────────────────────────────────────
log_level: INFO
log_dir: logs

# ─── Notes ──────────────────────────────────────────────────
#
# Payment (burn_rate_tao, limit_price_rao) comes from the public control.json
# payment block. Do not set it here unless you are testing offline — a burn that
# does not match the round's rate is rejected, and rejected burns are not refunded.
#
# ⚠️ On a workspace that mines a competition (the `competition:` section above)
# burn_rate_tao is not read at all, and setting it does not let you skip
# anything: that fee comes from the season and is confirmed against the backend
# in the moment before it is paid. A number typed here says how much, never
# which competition — so `openroboto burn` refuses instead of paying it.
#
# Typical flow:
#   openroboto doctor      # check GPU / Docker / config before spending anything
#   openroboto build       # build the openpi-runner image
#   openroboto train       # train one round
#   openroboto check       # verify the checkpoint layout BEFORE paying
#   openroboto submit      # upload -> burn -> announce
#   openroboto status      # what the subnet thinks of your submission
