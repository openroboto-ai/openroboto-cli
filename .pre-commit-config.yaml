# Local hooks. Install with `uv run pre-commit install` (pre-commit itself is not in
# the dev group; `uvx pre-commit` works too — it is a developer's personal tool and
# must not become part of the cost of installing this package).
#
# Hooks are not a replacement for CI, they **pull CI's red light forward to before the
# commit**. The real gate is `.github/workflows/ci.yml`; whatever cannot run here
# (pytest, the coverage threshold) is backstopped there.
#
# ⚠️ This file was cut down from the backend's file of the same name. That one had a
# batch of template leftovers removed (biome / generate-frontend-sdk /
# add-release-date / zizmor — all of them only meaningful for a frontend or a
# frontend+backend monorepo); **do not copy them back**: this repo has no frontend.
# `ty` was not copied either: it checks the SQLModel / SQLAlchemy layer, and this repo
# does not have a single line of ORM.


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        # --unsafe: syntax check only, no object construction. The `on:` key in a
        # GitHub workflow is parsed as boolean true by YAML 1.1, so a strict load
        # errors out instead.
        args:
          - --unsafe
      # Measured reminder: the first `pre-commit run --all-files` will add trailing
      # newlines / strip trailing whitespace on roughly 20 old files inherited from
      # openroboto-subnet. That is one-off whitespace noise and does not change
      # behavior; day to day the hooks only look at **staged** files, which is why no
      # exclusion rule was added for the old files — if one were added, someone would
      # have to remember to delete it once those files are really moved into src/.
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      # Secrets never enter version control (AGENTS.md §4). A miner's miner.yaml holds
      # an HF token and a wallet password; this hook blocks a private key from being
      # added by mistake.
      - id: detect-private-key

  - repo: https://github.com/crate-ci/typos
    rev: bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # frozen: v1.48.0
    hooks:
      - id: typos
        # --force-exclude: without it, the filenames pre-commit passes in would bypass
        # the --exclude below.
        #
        # docs/api_reference_en.md is excluded because of a **false positive**, not
        # because that document is unimportant: it quotes the raw hexadecimal strings
        # of drand randomness, and typos slices two letters out of them and reports
        # them as a misspelled English word. Maintaining a whole _typos.toml for one
        # false positive is not worth it; the day that document no longer quotes raw
        # randomness, delete this line.
        # (By the same token, do not repeat the two falsely reported letters in this
        # comment — that would turn this file red too.)
        args: [--force-exclude, --exclude, "docs/api_reference_en.md"]

  - repo: local
    hooks:
      # These three are the same set of tools as scripts/lint.sh, wired as local +
      # `uv run` rather than ruff's official mirror repo: the mirror would install a
      # second version of ruff, so the hooks and CI would fight each other with
      # different ruff versions. The version is decided in exactly one place: uv.lock.
      #
      # language: system — the `unsupported` written in the template is not a valid
      # value, and the hook would simply never run.
      - id: local-ruff-check
        name: ruff check
        # --force-exclude: pyproject's extend-exclude (the old files inherited from
        # openroboto-subnet) must take effect, otherwise the hook is permanently red
        # on that batch of files.
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: system
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        require_serial: true
        language: system
        types: [python]

      # mypy only checks src (reason in pyproject.toml's [tool.mypy]), so it takes no
      # filename arguments — what gets passed in may be tests/ or old files, and that
      # is not its scope.
      - id: local-mypy
        name: mypy check
        entry: uv run mypy src
        require_serial: true
        language: system
        pass_filenames: false
