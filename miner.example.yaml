# RobotTrain — Miner Configuration Example
#
# Copy to miner.yaml and fill in required fields.
# Runtime parameters: this file + control.json (HTTP).
# NO environment variable fallback.

# ─── Bittensor Subnet ──────────────────────────────
subnet:
  network: finney                  # finney (mainnet) | test | local
  netuid: 80                       # mainnet netuid (testnet was: network=test, netuid=313)
  subtensor_endpoint: ""           # optional WS endpoint override
  wallet_path: ""                  # empty uses the Bittensor SDK default
  coldkey: default
  hotkey: default
  hotkey_ss58: ""                  # recommended: set to avoid wallet read issues
  wallet_password: ""              # wallet unlock password (set to skip interactive prompt)

# ─── Public HTTP resources ──────────────────────────
urls:
  control_json: "https://api.openroboto.ai/control.json"
  dataset_train: "https://api.openroboto.ai/train.json"
  dataset_val: "https://api.openroboto.ai/val.json"

# ─── Model ──────────────────────────────────────────
model:
  vla_model_id: pi05
  vla_checkpoint_path: "/path/to/cache/pi05_base"
  cache_dir: "/models"

# ─── HuggingFace ────────────────────────────────────
huggingface:
  token: "hf_xxx"
  username: "<your-username>"

# ─── Miner ──────────────────────────────────────────
custom_train_script: ""            # optional: /path/to/custom_strategy.py

# ─── Logging ────────────────────────────────────────
log_level: INFO
log_dir: logs

# ─── Notes ──────────────────────────────────────────
#
# Steps 1-2 (prep + training) are run by miner.py
# Steps 3-5 (upload, burn, announce) are run by rt.py
#
# Payment (burn_rate_tao, limit_price_rao) comes from
# public control.json → payment block, NOT set here.
#
