name: CI

# 这个仓在此之前**没有任何测试和 lint 在 CI 上跑** —— 103 条用例只在作者本机跑过。
# 面向外部矿工的包，坏了不会有人立刻告诉我们（AGENTS.md 顶部那段警告），
# 只会看到提交量下降。
#
# 触发面与 protocol-guards.yml 对齐：单分支，main 是唯一长期分支，功能走 PR。
# 直推 main 也跑一遍 —— 只在 PR 上触发的话，直推的改动一次检查都不会过。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # release.yml 通过 workflow_call 调进来 —— 于是**门槛只有这一份定义**。
  # 在发版 workflow 里另写一套"发版前检查"，写出来的必然更弱（没人会把 lint、
  # 类型、127 条用例和覆盖率门槛再敲一遍），而且两份迟早只有一份是对的。
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 升版本前先确认 astral-sh/setup-uv 知道它的 checksum：
  # https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
  UV_VERSION: "0.11.18"

jobs:
  ci:
    name: lint + tests (py3.11)
    runs-on: ubuntu-latest
    # 15 分钟不够：主依赖里有 bittensor，它拖 torch，冷缓存下装依赖就要好几分钟。
    timeout-minutes: 25

    # ─────────────────────────────────────────────────────────────────────────
    # 2026-08-19：单仓 CI。
    #
    # 此前这里要 checkout **两个平级目录**，因为 openroboto-protocol 还没发 PyPI，
    # pyproject 里是 `path = "../openroboto-protocol"` 的 editable 依赖 ——
    # 少了那个目录 `uv sync --locked` 第一步就死，不是"某几条用例 skip"而是
    # 整个 job 装不起来。协议包发布后（0.1.0 / 0.2.0 已在 PyPI），
    # `[tool.uv.sources]` 和第二个 checkout 一起删掉了。
    #
    # 版本对不上的信号仍然保留、而且更强：`uv.lock` 里钉着
    # `openroboto-protocol==0.2.0` 且带哈希，协议包发了新版而消费方没跟上时
    # `--locked` 当场红 —— 不需要靠 checkout main 来制造这个信号。
    # ─────────────────────────────────────────────────────────────────────────
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked：依赖变了却没更新 uv.lock 时当场失败，而不是让 CI 自己悄悄重新
      # 解析一遍 —— 那样 CI 装的和矿工装的就不是同一套。
      # 解释器版本由 .python-version 决定（3.11，矿工侧就是 3.11），
      # 所以这里不用 setup-python，让 uv 自己管。
      - run: uv sync --locked

      # 和本地跑的是**同一个脚本**。CI 里再抄一遍命令列表，两边就会各自漂。
      - name: Lint
        run: bash scripts/lint.sh

      # --source=src：不写的话 coverage 会把 pytest 自己也算进分母，门槛失去意义。
      # --junitxml 给下一步的 skip 审计留一份机器可读的报告。
      - name: Test
        run: |
          uv run coverage run --source=src -m pytest -q \
            --junitxml=pytest-report.xml

      # ───────────────────────────────────────────────────────────────────────
      # skip 不是免费的绿灯。允许的 skip 只有一种理由：**这台 runner 上东西物理
      # 不存在**（backend 的同名步骤里，白名单放的就是这一种）。
      #
      # 本仓的白名单是**空的**，而且这是个结论不是偷懒：协议包从 PyPI 装（不再
      # 依赖同级检出），本仓的用例又不需要 GPU、不需要真链、不需要网络
      #（AGENTS.md §4：涉及 docker run 与链交互的只测参数拼装）。
      # 于是"runner 上没有"这条唯一合法理由在这里不成立 —— 任何 skip 都红。
      #
      # 今天实测 0 条 skip。这一步防的是明天：有人加一条
      # `pytest.importorskip("bittensor")` 把用例悄悄关掉，CI 依然是绿的。
      # ───────────────────────────────────────────────────────────────────────
      - name: Skip audit
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          # 空元组 = 一条 skip 都不放行。要往里加，先回答"这台 runner 上缺的到底是
          # 什么东西"，答不上来就说明那是配置漏了，本来跑得了。
          ALLOWED: tuple[str, ...] = ()

          # junit 里 xfail 也写成 <skipped>，靠 type 区分；只审真 skip。
          skipped = [
              (f"{case.get('classname')}::{case.get('name')}", el.get("message", ""))
              for case in ET.parse("pytest-report.xml").iter("testcase")
              for el in case.findall("skipped")
              if el.get("type") == "pytest.skip"
          ]
          for name, reason in skipped:
              print(f"skip: {name} — {reason}")
          bad = [(n, r) for n, r in skipped if not any(a in r for a in ALLOWED)]
          for name, reason in bad:
              print(f"::error::白名单之外的 skip（不是「runner 上没有」就得跑）：{name} — {reason}")
          print(f"skip 合计 {len(skipped)} 条，其中白名单外 {len(bad)} 条")
          sys.exit(1 if bad else 0)
          PY

      # 门槛（fail_under）写在 pyproject.toml 的 [tool.coverage.report] 里，
      # 本地 `uv run coverage report` 和 CI 用的是同一个值。
      # 这里不重复写数字：写两处就会有一处忘了改，而"忘了改"的方向永远是调低。
      # show_missing = true（pyproject 里）已经把没覆盖到的行号直接打进日志，
      # 所以不传 htmlcov 产物：GitHub Free 的 Actions 存储只有 500 MB，
      # 一个没人点开的报告不值得占额度。要看逐行报告就在本地 `uv run coverage html`。
      - name: Coverage gate
        run: uv run coverage report

  # ───────────────────────────────────────────────────────────────────────────
  # 构建并**验证产物本身**，而不是只验证源码。
  #
  # 今天（2026-08-19）刚踩过一次这个坑的近亲：`.dockerignore` 里一条 `*.yaml`
  # 把 `templates/*.yaml` 一起排除了，镜像构建成功、只在矿工第一次
  # `openroboto init` 时才炸。打包侧的排除规则同样是静默的 —— 少一个模板，
  # wheel 照样能装、`--version` 照样能跑，直到有人真去用那条命令。
  #
  # 所以这里装的是**打出来的 wheel**，然后检查里面确实有那些非 .py 的东西。
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: build + verify the artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - run: uv build

      # tag 发版时，tag 名与包版本必须一致。消费方拿到的是版本号，
      # 而 tag 是那个版本对应的不可变 git 引用 —— 两者对不上就无从追溯。
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(uv run python -c 'import openroboto; print(openroboto.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag 与包版本 $version 对不上"
            exit 1
          fi
          echo "tag 与包版本一致：$version"

      # 装 wheel（不是源码树）再检查内容物。
      - name: The wheel actually contains what the commands need
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())

          # 每一条都对应一个"少了它，某条命令在矿工机器上才炸"的场景：
          required = {
              "openroboto/templates/miner.yaml": "openroboto init 生成不出配置",
              "openroboto/templates/validator.yaml": "openroboto init --validator 失败",
              "openroboto/templates/simple/train_strategy.py": "init 给不出策略脚本",
              "openroboto/templates/gitignore": "工作区没有 .gitignore，"
                                                "矿工第一次 git add 就提交钱包密码",
              "openroboto/templates/README-miner.md": "工作区没有说明",
              "openroboto/runner/Dockerfile": "openroboto build 没有构建上下文",
              "openroboto/runner/train_runner.py": "训练镜像里没有入口脚本",
          }
          missing = {p: why for p, why in required.items() if p not in names}
          for path, why in missing.items():
              print(f"::error::wheel 里缺 {path} —— {why}")
          sys.exit(1 if missing else 0)
          PY

      # 装到一个干净环境里，确认命令真的能跑起来。
      # `--version` 会同时打印协议包版本，所以它也顺带证明依赖装上了。
      - name: The installed command runs
        run: |
          python3 -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/openroboto --version
          /tmp/verify/bin/openroboto --help > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
