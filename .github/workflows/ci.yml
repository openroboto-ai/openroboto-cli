name: CI

# Lint, types, the test suite and the coverage gate, all through the same commands a
# developer runs locally. Before this workflow existed the tests had only ever run on
# the author's own machine. For a package aimed at external miners, breaking it does
# not get reported to us right away (see the warning at the top of AGENTS.md); we would
# only see submissions drop.
#
# The trigger surface is aligned with protocol-guards.yml: a single branch, main is the
# only long-lived branch, features go through PRs. A direct push to main runs it too —
# if it only triggered on PRs, a directly pushed change would never pass a single check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # release.yml calls in via workflow_call — so **the gate has exactly one definition**.
  # Writing a separate set of "pre-release checks" in the release workflow would
  # inevitably be weaker (nobody is going to retype lint, types, the whole test suite
  # and the coverage threshold), and sooner or later only one of the two would be
  # correct.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Before bumping the version, confirm astral-sh/setup-uv knows its checksum:
  # https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
  UV_VERSION: "0.11.18"

jobs:
  ci:
    name: lint + tests (py3.11)
    runs-on: ubuntu-latest
    # 15 minutes is not enough: bittensor is a main dependency, it drags torch in, and
    # installing dependencies on a cold cache alone takes several minutes.
    timeout-minutes: 25

    # ─────────────────────────────────────────────────────────────────────────
    # 2026-08-19: single-repo CI.
    #
    # This used to check out **two sibling directories**, because openroboto-protocol
    # had not been published to PyPI yet and pyproject carried an editable dependency
    # with `path = "../openroboto-protocol"` — without that directory, the very first
    # step of `uv sync --locked` died; not "a few test cases skip" but the whole job
    # failing to install. Once the protocol package was published (0.1.0 / 0.2.0 are on
    # PyPI), `[tool.uv.sources]` and the second checkout were deleted together.
    #
    # The signal for a version mismatch is still there, and stronger: `uv.lock` pins
    # `openroboto-protocol` at the exact version with hashes (0.9.0 today — read
    # `pyproject.toml`, not this comment), so when the protocol package ships a new
    # version and the consumer has not caught up, `--locked` goes red on the spot —
    # there is no need to check out main to manufacture that signal.
    # ─────────────────────────────────────────────────────────────────────────
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked: fail on the spot when dependencies changed without uv.lock being
      # updated, instead of letting CI quietly re-resolve on its own — that way what CI
      # installs would not be what miners install.
      # The interpreter version is decided by .python-version (3.11, which is what the
      # miner side runs), so setup-python is not used here; uv manages it.
      - run: uv sync --locked

      # This is the **same script** that runs locally. Copying the command list into CI
      # again would let the two sides drift apart.
      - name: Lint
        run: bash scripts/lint.sh

      # --source=src: without it, coverage counts pytest itself into the denominator and
      # the threshold becomes meaningless.
      # --junitxml leaves a machine-readable report for the skip audit in the next step.
      - name: Test
        run: |
          uv run coverage run --source=src -m pytest -q \
            --junitxml=pytest-report.xml

      # ───────────────────────────────────────────────────────────────────────
      # A skip is not a free green light. There is only one acceptable reason for a
      # skip: **the thing physically does not exist on this runner** (that is exactly
      # what the allowlist in the backend's step of the same name is for).
      #
      # This repo's allowlist is **empty**, and that is a conclusion, not laziness: the
      # protocol package is installed from PyPI (no sibling checkout needed any more),
      # and this repo's tests need no GPU, no real chain, no network
      # (AGENTS.md §4: anything involving docker run or chain interaction only tests
      # argument assembly). So the one legitimate reason, "not present on the runner",
      # does not hold here — any skip goes red.
      #
      # Measured 2026-09-02: 449 passed, 0 skipped. What this step guards against is
      # tomorrow: someone adding a `pytest.importorskip("bittensor")` that quietly
      # switches tests off while CI stays green.
      # ───────────────────────────────────────────────────────────────────────
      - name: Skip audit
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          # Empty tuple = not a single skip is allowed through. To add one, first answer
          # "what exactly is missing on this runner"; if you cannot answer, it means the
          # configuration is incomplete and the test could have run.
          ALLOWED: tuple[str, ...] = ()

          # In junit, xfail is also written as <skipped>; they are told apart by type,
          # and only real skips are audited.
          skipped = [
              (f"{case.get('classname')}::{case.get('name')}", el.get("message", ""))
              for case in ET.parse("pytest-report.xml").iter("testcase")
              for el in case.findall("skipped")
              if el.get("type") == "pytest.skip"
          ]
          for name, reason in skipped:
              print(f"skip: {name} — {reason}")
          bad = [(n, r) for n, r in skipped if not any(a in r for a in ALLOWED)]
          for name, reason in bad:
              print(f"::error::skip outside the allowlist (unless it is 'not present on the runner', it has to run): {name} — {reason}")
          print(f"{len(skipped)} skips in total, {len(bad)} of them outside the allowlist")
          sys.exit(1 if bad else 0)
          PY

      # The threshold (fail_under) lives in [tool.coverage.report] in pyproject.toml, so
      # local `uv run coverage report` and CI use the same value.
      # The number is not repeated here: written in two places, one of them will be
      # forgotten, and the direction of "forgot to update" is always downward.
      # show_missing = true (in pyproject) already prints the uncovered line numbers
      # straight into the log, so no htmlcov artifact is uploaded: GitHub Free only
      # gives 500 MB of Actions storage, and a report nobody opens is not worth the
      # quota. For a line-by-line report, run `uv run coverage html` locally.
      - name: Coverage gate
        run: uv run coverage report

  # ───────────────────────────────────────────────────────────────────────────
  # Build and **verify the artifact itself**, not just the source.
  #
  # A close relative of this trap was hit today (2026-08-19): one `*.yaml` line in
  # `.dockerignore` excluded `templates/*.yaml` along with it; the image built fine and
  # only blew up on a miner's first `openroboto init`. Packaging-side exclusion rules
  # are just as silent — with one template missing, the wheel still installs and
  # `--version` still runs, right up until someone actually uses that command.
  #
  # So what gets installed here is **the wheel that was built**, and then it is checked
  # that the non-.py things really are inside it.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: build + verify the artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - run: uv build

      # When releasing from a tag, the tag name and the package version must match.
      # Consumers get a version number, while the tag is the immutable git reference for
      # that version — if the two disagree, there is no way to trace anything back.
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(uv run python -c 'import openroboto; print(openroboto.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match package version $version"
            exit 1
          fi
          echo "tag matches package version: $version"

      # Install the wheel (not the source tree), then check its contents.
      - name: The wheel actually contains what the commands need
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())

          # Each entry corresponds to a "without it, some command only blows up on a
          # miner's machine" scenario:
          required = {
              "openroboto/templates/miner.yaml": "openroboto init cannot generate a config",
              "openroboto/templates/validator.yaml": "openroboto init --validator fails",
              "openroboto/templates/simple/train_strategy.py": "init cannot hand out a strategy script",
              "openroboto/templates/gitignore": "the workspace has no .gitignore, "
                                                "so a miner commits the wallet password on the first git add",
              "openroboto/templates/README-miner.md": "the workspace has no documentation",
              "openroboto/templates/README-validator.md": "openroboto init --validator fails: "
                                                          "init.py reads this file unconditionally",
              "openroboto/runner/Dockerfile": "openroboto build has no build context for pi0.5",
              "openroboto/runner/train_runner.py": "the pi0.5 training image has no entrypoint script",
              # The current season runs on LingBot-VLA 2.0, so these two are the ones
              # `openroboto build` actually reaches today.
              "openroboto/runner/lingbot/Dockerfile": "openroboto build has no build context "
                                                      "for LingBot-VLA 2.0 — the current season",
              "openroboto/runner/lingbot/train_runner.py": "the LingBot training image has no "
                                                           "entrypoint script",
          }
          missing = {p: why for p, why in required.items() if p not in names}
          for path, why in missing.items():
              print(f"::error::{path} is missing from the wheel — {why}")
          sys.exit(1 if missing else 0)
          PY

      # Install into a clean environment and confirm the command really starts up.
      # `--version` also prints the protocol package version, so it doubles as proof
      # that the dependencies were installed.
      - name: The installed command runs
        run: |
          python3 -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/openroboto --version
          /tmp/verify/bin/openroboto --help > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
