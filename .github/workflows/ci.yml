name: CI

# 这个仓在此之前**没有任何测试和 lint 在 CI 上跑** —— 103 条用例只在作者本机跑过。
# 面向外部矿工的包，坏了不会有人立刻告诉我们（AGENTS.md 顶部那段警告），
# 只会看到提交量下降。
#
# 触发面与 protocol-guards.yml 对齐：单分支，main 是唯一长期分支，功能走 PR。
# 直推 main 也跑一遍 —— 只在 PR 上触发的话，直推的改动一次检查都不会过。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 升版本前先确认 astral-sh/setup-uv 知道它的 checksum：
  # https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
  UV_VERSION: "0.11.18"

jobs:
  ci:
    name: lint + tests (py3.11)
    runs-on: ubuntu-latest
    # 15 分钟不够：主依赖里有 bittensor，它拖 torch，冷缓存下装依赖就要好几分钟。
    timeout-minutes: 25

    # ─────────────────────────────────────────────────────────────────────────
    # 两个仓都要 checkout，且必须是**平级的两个目录**。
    #
    # 原因在 pyproject.toml 的 [tool.uv.sources]：openroboto-protocol 还没发到
    # PyPI，现在是 `path = "../openroboto-protocol"` 的 editable 依赖。
    # 只 checkout 本仓的话，`uv sync --locked` 第一步就死：
    #   error: Failed to generate package metadata for
    #   `openroboto-protocol==0.2.0 @ editable+../openroboto-protocol`
    #     Caused by: Distribution not found at: .../openroboto-protocol
    # —— 不是"某几条用例 skip"，是整个 job 装不起来。所以这里不是"想不想多 checkout
    # 一个仓"，是这条依赖今天只有这一种满足方式。
    #
    # 协议包发到 PyPI 之后（openroboto-protocol 的 CI 里那个 build job 上面写着
    # 为什么还没接 publish），删掉 [tool.uv.sources] 与下面第二个 checkout，
    # 这个 job 就退回成普通的单仓 CI。
    #
    # 不钉 ref，跟 main：uv.lock 里写死 `openroboto-protocol==0.2.0`，协议包哪天
    # 改了版本号而消费方没跟上，`--locked` 会当场红。这正是我们要知道的事 ——
    # 钉死 ref 等于把这个信号关掉。
    # ─────────────────────────────────────────────────────────────────────────
    defaults:
      run:
        working-directory: openroboto-cli

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openroboto-cli
          persist-credentials: false

      - name: Checkout openroboto-protocol (path dependency, see above)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openroboto-ai/openroboto-protocol
          path: openroboto-protocol
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # setup-uv 默认在仓库根找 uv.lock 做缓存 key，这里代码在子目录里。
          cache-dependency-glob: openroboto-cli/uv.lock

      # --locked：依赖变了却没更新 uv.lock 时当场失败，而不是让 CI 自己悄悄重新
      # 解析一遍 —— 那样 CI 装的和矿工装的就不是同一套。
      # 解释器版本由 .python-version 决定（3.11，矿工侧就是 3.11），
      # 所以这里不用 setup-python，让 uv 自己管。
      - run: uv sync --locked

      # 和本地跑的是**同一个脚本**。CI 里再抄一遍命令列表，两边就会各自漂。
      - name: Lint
        run: bash scripts/lint.sh

      # --source=src：不写的话 coverage 会把 pytest 自己也算进分母，门槛失去意义。
      # --junitxml 给下一步的 skip 审计留一份机器可读的报告。
      - name: Test
        run: |
          uv run coverage run --source=src -m pytest -q \
            --junitxml=pytest-report.xml

      # ───────────────────────────────────────────────────────────────────────
      # skip 不是免费的绿灯。允许的 skip 只有一种理由：**这台 runner 上东西物理
      # 不存在**（backend 的同名步骤里，白名单放的就是这一种）。
      #
      # 本仓的白名单是**空的**，而且这是个结论不是偷懒：上面已经把同级的
      # openroboto-protocol 一起 checkout 了，本仓的用例又不需要 GPU、不需要真链、
      # 不需要网络（AGENTS.md §4：涉及 docker run 与链交互的只测参数拼装）。
      # 于是"runner 上没有"这条唯一合法理由在这里不成立 —— 任何 skip 都红。
      #
      # 今天实测 0 条 skip。这一步防的是明天：有人加一条
      # `pytest.importorskip("bittensor")` 把用例悄悄关掉，CI 依然是绿的。
      # ───────────────────────────────────────────────────────────────────────
      - name: Skip audit
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          # 空元组 = 一条 skip 都不放行。要往里加，先回答"这台 runner 上缺的到底是
          # 什么东西"，答不上来就说明那是配置漏了，本来跑得了。
          ALLOWED: tuple[str, ...] = ()

          # junit 里 xfail 也写成 <skipped>，靠 type 区分；只审真 skip。
          skipped = [
              (f"{case.get('classname')}::{case.get('name')}", el.get("message", ""))
              for case in ET.parse("pytest-report.xml").iter("testcase")
              for el in case.findall("skipped")
              if el.get("type") == "pytest.skip"
          ]
          for name, reason in skipped:
              print(f"skip: {name} — {reason}")
          bad = [(n, r) for n, r in skipped if not any(a in r for a in ALLOWED)]
          for name, reason in bad:
              print(f"::error::白名单之外的 skip（不是「runner 上没有」就得跑）：{name} — {reason}")
          print(f"skip 合计 {len(skipped)} 条，其中白名单外 {len(bad)} 条")
          sys.exit(1 if bad else 0)
          PY

      # 门槛（fail_under）写在 pyproject.toml 的 [tool.coverage.report] 里，
      # 本地 `uv run coverage report` 和 CI 用的是同一个值。
      # 这里不重复写数字：写两处就会有一处忘了改，而"忘了改"的方向永远是调低。
      # show_missing = true（pyproject 里）已经把没覆盖到的行号直接打进日志，
      # 所以不传 htmlcov 产物：GitHub Free 的 Actions 存储只有 500 MB，
      # 一个没人点开的报告不值得占额度。要看逐行报告就在本地 `uv run coverage html`。
      - name: Coverage gate
        run: uv run coverage report
