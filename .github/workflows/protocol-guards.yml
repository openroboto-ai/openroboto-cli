name: protocol guards

# This is currently the **only** workflow in this repo — CI for lint / type checking /
# tests is not wired up yet (`uv run ruff format --check .` is currently red on 6 files
# inherited from openroboto-subnet, and how to handle those files has to be decided
# first). These two protocol-package-related defenses are put up ahead of that, because
# what they guard against is **silent** failure: drift makes nothing report an error, it
# just makes an evaluation impossible to reproduce one day.
#
# The original wording and rationale of both checks are in
# `../openroboto-protocol/README.md`, under
# "What consumers must add to their own CI".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: protocol-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: no vendored copy + version pinned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ───────────────────────────────────────────────────────────────────────
      # A vendored copy of protocol/ must not appear anywhere in the repository. With
      # this package installed and an old copy still around, imports silently resolve to
      # the copy — which is exactly the path along which protocol/types.py once drifted
      # by 105 lines and payment.py by 313 lines (miners encoding by A, the backend
      # decoding by B).
      #
      # This step used to carry an exemption list (`protocol/{__init__,seed,types}.py`),
      # because SCOPE.md required that no inherited old file be deleted. The list stated
      # its exit condition as "the day they disappear" — **2026-08-19 was that day**:
      # the old structure was deleted wholesale, the exemption went with it, and this
      # step is back to the upstream original semantics: **the list must be empty**.
      #
      # continue-on-error is not used (nobody looks at yellow), and the scan is not
      # limited to src/ (a copy is precisely what does not show up in src/, and a check
      # that can never go red is decoration).
      # The corresponding local test is tests/test_vendored_protocol.py; both layers are
      # kept: pytest makes it visible immediately, CI blocks commits that bypassed the
      # local hooks.
      # ───────────────────────────────────────────────────────────────────────
      - name: No vendored protocol copy
        run: |
          copies="$(git ls-files '*protocol/*.py')"
          if [ -n "$copies" ]; then
            echo "::error::vendored protocol copy found; import openroboto_protocol instead."
            echo "$copies"
            echo "Protocol fields and on-chain formats may only come from the openroboto-protocol package (AGENTS.md red line #1)."
            echo "A copy like this once drifted by 105 lines: miners encoding by A, the backend decoding by B."
            exit 1
          fi
          echo "no vendored protocol copy"

      # ───────────────────────────────────────────────────────────────────────
      # The version must be pinned. `>=` / `~=` means the miner side and the backend
      # side may resolve to different code, and "both sides can be proven to have
      # installed the same thing" is the only reason openroboto-protocol exists.
      #
      # The dependency tables are parsed rather than grepped line by line: this repo's
      # pyproject.toml has 3 comment lines and 1 [tool.uv.sources] line mentioning this
      # package name without being a dependency declaration, and a line-level grep
      # misjudges all of them as floating versions.
      # ───────────────────────────────────────────────────────────────────────
      - name: Protocol version is pinned
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import tomllib

          reqs: list[str] = []
          path = pathlib.Path("pyproject.toml")
          if path.is_file():
              data = tomllib.loads(path.read_text("utf-8"))
              project = data.get("project", {})
              reqs += project.get("dependencies", [])
              for group in project.get("optional-dependencies", {}).values():
                  reqs += group
              # Entries in dependency-groups may be tables such as {include-group = "..."}.
              for group in data.get("dependency-groups", {}).values():
                  reqs += [item for item in group if isinstance(item, str)]
          for req_file in sorted(pathlib.Path().glob("requirements*.txt")):
              reqs += [
                  line.split("#", 1)[0].strip()
                  for line in req_file.read_text("utf-8").splitlines()
              ]

          floating = [
              req for req in reqs
              if req.replace(" ", "").startswith("openroboto-protocol")
              and "==" not in req
          ]
          if floating:
              print("::error::openroboto-protocol must be pinned to an exact version:")
              print("\n".join(floating))
              sys.exit(1)
          print(f"pin ok ({len(reqs)} requirements scanned)")
          PY
