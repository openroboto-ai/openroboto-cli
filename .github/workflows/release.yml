name: Release

# ═══════════════════════════════════════════════════════════════════════════════
# 这个包发出去之后，装它的人不在团队里
#
# `openroboto` 是矿工敲的一切。发错一个版本，表现不是 CI 变红，而是某个我们
# 不认识的人在自己的机器上烧掉了不退的 TAO —— 而我们只会看到提交量下降。
#
# 所以这里的每一道闸都不是流程洁癖：
#   · 往索引上传只认 v* tag（不可变的 git 引用，且它就是版本号本身）
#   · 手动触发**永远**到不了正式 PyPI，`publish` job 的 `if` 钉死了这一点
#   · 两条路跑的是同一份 gates、上传的是同一份产物，只换上传目标
#   · environment 限定部署来源：`pypi` 只接 `v*` tag、`testpypi` 只接 main
#
# 🔴 **少一道闸：没有人工审批。** required reviewers 在私有仓上要付费计划，
# 而 openroboto-ai 目前是 free（2026-08-19 实测，API 返回 422）。也就是说
# **`git push origin v0.1.0a1` 会一路发到 PyPI，中间没有第二双眼睛**，
# 而上传不可撤销、版本号不可重用。
# 补上它的办法：把仓库转公开（公开仓的 required reviewers 免费，而这个仓本来
# 就要在上线时转公开），或者升级到 Team。在那之前，push tag 这个动作本身
# 就是最后一道闸 —— 推之前请自己确认一次版本号。
#
# 内测版和正式版都发**正式 PyPI**，靠版本号区分（`v0.1.0a1` vs `v0.1.0`）：
# pip 有正式版时不会选预发布版，所以内测者 `pip install openroboto==0.1.0a1`
# 就够了，而矿工裸装拿不到它。TestPyPI 只留作发布链路本身的排练场。
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: '发到 TestPyPI（不是正式 PyPI）。输入 testpypi 确认'
        required: true
        default: ''
        type: string

permissions:
  contents: read

# cancel-in-progress: false —— 和 ci.yml 相反，是故意的。上传到索引不可撤销也
# 不可重放（同一个版本号只能传一次），跑到一半被后来的 workflow 掐掉，
# 留下的是一个"发了一半"的版本，比慢一点糟糕得多。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.18"

jobs:
  # 门槛就是每个 PR 跑的那一套，一行不差 —— 直接 uses ci.yml。
  # 它顺带产出 `dist` artifact，并且已经验过 wheel 里模板与构建上下文都在、
  # 装完命令跑得动、tag 与包版本一致。
  gates:
    name: gates (the same ones every PR runs)
    uses: ./.github/workflows/ci.yml

  # ───────────────────────────────────────────────────────────────────────────
  # TestPyPI —— **只用来排练发布链路本身**，不是内测版的分发渠道。
  #
  # 内测版走正式 PyPI（见下面 `publish`）：预发布版号 + 精确钉住就够了，
  #   pip install openroboto==0.1.0a1
  # 而 TestPyPI 要求内测者额外记住两个 index 参数
  #   （`--extra-index-url` 还是必需的，因为 bittensor 这些真依赖只在正式 PyPI 上）
  # —— 为了一个本来就不会被误装的版本，让每个内测者多敲两行，不值得。
  #
  # 留着它的理由只有一个：`uv publish`、OIDC 交换、environment 审批这几步，
  # 在真正往正式 PyPI 传之前，需要有地方能整条跑一遍。跑的是**同一份 gates、
  # 同一份产物**，只换上传目标 —— 不存在"两套流程漂移"的空间。
  #
  # ⚠️ TestPyPI 的版本号**同样不可重用**，排练也会烧号。
  # ───────────────────────────────────────────────────────────────────────────
  publish-testpypi:
    name: publish to TestPyPI
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'testpypi'

    environment:
      name: testpypi
      url: https://test.pypi.org/p/openroboto

    permissions:
      id-token: write
      contents: read

    steps:
      # 不 checkout：发布的是 gates 里构建并验证过的那份产物，不是重新构建的
      # 另一份。少一次 checkout 也意味着这个拿着 id-token 的 job 里没有仓库
      # 代码可执行，唯一跑起来的东西是 uv publish。
      - name: Download the artifact that passed the gates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Publish
        run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*

  # ───────────────────────────────────────────────────────────────────────────
  # 正式 PyPI。**正式版和预发布版都走这里**，靠版本号区分：
  #   v0.1.0a1 / v0.1.0rc1  → 内测版，`pip install openroboto` 不会选中它
  #   v0.1.0                → 正式版
  #
  # pip 的规则（实测）：有正式版时只选正式版，预发布版要 `--pre` 或精确钉住。
  # PyPI 没有 npm 那种 dist-tag，版本号本身就是那个开关。
  #
  # 🔴 **有一个窗口期例外，别踩**：`openroboto` 至今没发过正式版，而"没有正式版
  # 可选时 pip 会选预发布版"。也就是说在 0.1.0 发出去之前，第一个 alpha 就是
  # 裸 `pip install openroboto` 装到的东西。两个办法：早点发一个正式 0.1.0，
  # 或者内测结束后把 alpha 在 PyPI 上 yank 掉（PEP 592：yank 掉的版本除非被
  # 精确钉住，否则解析器不会选它 —— 已经装了的人不受影响）。
  #
  # Trusted Publishing（OIDC），不放长期 token。
  #
  # 理由：长期 token 放在 repo secrets 里，谁看过、什么时候泄的、泄了之后被用来
  # 发过什么，事后都查不出来 —— 而这个 token 的权限是"以 OpenRoboto 的名义往
  # PyPI 发任意版本"，拿到它的人可以给全体矿工推一个改过 burn 金额的 0.1.1。
  # OIDC 换来的 token 只对这一次 run 有效，且 PyPI 侧还要求它来自指定的
  # repo + workflow 文件 + environment，仓库里没有任何可偷的东西。
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: publish to PyPI
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 🔴 手动触发**永远**到不了正式 PyPI。没有这一行，`workflow_dispatch`
    # 会把两个 publish job 一起点着，而这一个是不可撤销的。
    if: startsWith(github.ref, 'refs/tags/v')

    # environment 现在起两个作用：
    #   1. 部署来源限定为 `v*` tag —— 即使有人改坏了上面那个 `if`，
    #      非 tag 的触发也进不来（2026-08-19 配好，`gh api ... /environments/pypi`）；
    #   2. PyPI 的 trusted publisher 配置里填的就是这个名字，对不上 OIDC 直接被拒。
    #      改名字要同时改 pypi.org 上那条记录。
    #
    # 🔴 它**还不能**起第三个作用 —— 人工审批。见文件头那段：免费计划上
    # 私有仓配不了 required reviewers。转公开或升 Team 之后，来这里把这条注释改掉。
    environment:
      name: pypi
      url: https://pypi.org/p/openroboto

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download the artifact that passed the gates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # ci.yml 已经比过一次 tag 与 pyproject 的 version。这里再比一次，比的是
      # **产物文件名** —— 也就是真正要上传的那堆字节。上一次证明的是"源码里写着
      # 0.1.0"，这一次证明的是"要传上去的包确实叫 0.1.0"。中间隔着一次 artifact
      # 上传下载。
      - name: Artifact version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for expected in \
            "dist/openroboto-${version}.tar.gz" \
            "dist/openroboto-${version}-py3-none-any.whl"; do
            if [ ! -f "$expected" ]; then
              echo "::error::产物里没有 $expected"
              ls -la dist/
              exit 1
            fi
          done
          echo "产物与 tag 一致：$version"

      - name: Publish
        run: uv publish dist/*
