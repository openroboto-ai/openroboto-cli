name: Release

# ═══════════════════════════════════════════════════════════════════════════════
# Once this package is published, the people installing it are not on the team
#
# `openroboto` is everything a miner types. Publishing a bad version does not show up
# as CI going red; it shows up as someone we have never met burning non-refundable TAO
# on their own machine — and all we would see is submissions dropping.
#
# So none of the gates here is process fussiness:
#   · uploading to an index only happens for a v* tag (an immutable git reference, and
#     it is the version number itself)
#   · a manual trigger can **never** reach real PyPI; the `if` on the `publish` job
#     nails that down
#   · both paths run the same gates and upload the same artifact, only the upload
#     target changes
#   · environment restricts the deployment source: `pypi` only accepts `v*` tags,
#     `testpypi` only accepts main
#
# 🔴 **One gate is missing: there is no human approval.** required reviewers need a
# paid plan on a private repo, and openroboto-ai is currently on free (measured
# 2026-08-19, the API returns 422). That means **`git push origin v0.1.0a1` goes all
# the way to PyPI with no second pair of eyes in between**, while an upload is
# irreversible and a version number cannot be reused.
# Ways to close it: make the repo public (required reviewers are free on public repos,
# and this repo is going public at launch anyway), or upgrade to Team. Until then, the
# act of pushing the tag is itself the last gate — please double-check the version
# number yourself before pushing.
#
# Beta versions and stable versions both go to **real PyPI**, distinguished by the
# version number (`v0.1.0a1` vs `v0.1.0`): pip will not pick a pre-release when a
# stable release exists, so `pip install openroboto==0.1.0a1` is enough for beta
# testers, while a plain install by a miner will not get it. TestPyPI is kept only as a
# rehearsal ground for the publishing pipeline itself.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Publish to TestPyPI (not real PyPI). Type testpypi to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

# cancel-in-progress: false — the opposite of ci.yml, and deliberate. Uploading to an
# index is neither reversible nor replayable (the same version number can only be
# uploaded once), and being cut off halfway by a later workflow leaves a
# "half-published" version behind, which is far worse than being slow.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.18"

jobs:
  # The gate is exactly the set every PR runs, line for line — it just uses ci.yml.
  # It also produces the `dist` artifact along the way, and has already verified that
  # the templates and the build context are inside the wheel, that the command runs
  # after installation, and that the tag matches the package version.
  gates:
    name: gates (the same ones every PR runs)
    uses: ./.github/workflows/ci.yml

  # ───────────────────────────────────────────────────────────────────────────
  # TestPyPI — **only used to rehearse the publishing pipeline itself**, it is not the
  # distribution channel for beta versions.
  #
  # Beta versions go through real PyPI (see `publish` below): a pre-release version
  # number plus an exact pin is enough,
  #   pip install openroboto==0.1.0a1
  # whereas TestPyPI would require beta testers to remember two extra index arguments
  #   (`--extra-index-url` is still required, because real dependencies such as
  #    bittensor only exist on real PyPI)
  # — making every beta tester type two more lines for a version that would not be
  # installed by accident anyway is not worth it.
  #
  # There is exactly one reason to keep it: `uv publish`, the OIDC exchange and the
  # environment approval need somewhere to be run end to end before anything is really
  # pushed to real PyPI. It runs **the same gates and the same artifact**, only the
  # upload target changes — there is no room for "two pipelines drifting apart".
  #
  # ⚠️ TestPyPI version numbers are **equally non-reusable**; a rehearsal burns a
  # number too.
  # ───────────────────────────────────────────────────────────────────────────
  publish-testpypi:
    name: publish to TestPyPI
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'testpypi'

    environment:
      name: testpypi
      url: https://test.pypi.org/p/openroboto

    permissions:
      id-token: write
      contents: read

    steps:
      # No checkout: what gets published is the artifact that was built and verified in
      # gates, not another one built again. One fewer checkout also means this job,
      # which holds an id-token, has no repository code available to execute; the only
      # thing that runs is uv publish.
      - name: Download the artifact that passed the gates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Publish
        run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*

  # ───────────────────────────────────────────────────────────────────────────
  # Real PyPI. **Both stable and pre-release versions go through here**, distinguished
  # by the version number:
  #   v0.1.0a1 / v0.1.0rc1  → beta version; `pip install openroboto` will not pick it
  #   v0.1.0                → stable version
  #
  # pip's rule (measured): when a stable release exists, only the stable release is
  # picked; a pre-release needs `--pre` or an exact pin. PyPI has no dist-tags like npm;
  # the version number itself is that switch.
  #
  # ✅ Stable releases exist (1.0.x / 1.1.x / 1.2.0), so a bare `pip install openroboto`
  # resolves to the newest stable one and never to a pre-release. The window this note
  # used to warn about — "no stable release yet, so pip picks the alpha" — is closed,
  # and the yank-the-alpha advice with it.
  #
  # Trusted Publishing (OIDC); no long-lived token is stored.
  #
  # Reason: with a long-lived token in repo secrets, who has seen it, when it leaked and
  # what was published with it afterwards are all impossible to determine after the
  # fact — and this token's permission is "publish any version to PyPI in OpenRoboto's
  # name", so whoever obtains it can push a 0.1.1 with a modified burn amount to every
  # miner. A token obtained via OIDC is valid only for this one run, and PyPI
  # additionally requires it to come from a specified repo + workflow file +
  # environment, so there is nothing in the repository worth stealing.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: publish to PyPI
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 🔴 A manual trigger can **never** reach real PyPI. Without this line,
    # `workflow_dispatch` would light up both publish jobs, and this one is
    # irreversible.
    if: startsWith(github.ref, 'refs/tags/v')

    # environment now serves two purposes:
    #   1. it restricts the deployment source to `v*` tags — even if someone breaks the
    #      `if` above, a non-tag trigger cannot get in (configured 2026-08-19, via
    #      `gh api ... /environments/pypi`);
    #   2. this exact name is what PyPI's trusted publisher configuration holds; if it
    #      does not match, OIDC is rejected outright. Renaming it requires changing that
    #      record on pypi.org at the same time.
    #
    # 🔴 It **cannot yet** serve a third purpose — human approval. See the block at the
    # top of this file: required reviewers cannot be configured for a private repo on
    # the free plan. Once the repo is public or upgraded to Team, come here and change
    # this comment.
    environment:
      name: pypi
      url: https://pypi.org/p/openroboto

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download the artifact that passed the gates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # ci.yml already compared the tag against pyproject's version once. It is compared
      # again here, this time against the **artifact filenames** — that is, the actual
      # bytes about to be uploaded. The first check proved "the source says 0.1.0", this
      # one proves "the package about to be uploaded really is called 0.1.0". An
      # artifact upload and download sits in between.
      - name: Artifact version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for expected in \
            "dist/openroboto-${version}.tar.gz" \
            "dist/openroboto-${version}-py3-none-any.whl"; do
            if [ ! -f "$expected" ]; then
              echo "::error::$expected is not in the artifact"
              ls -la dist/
              exit 1
            fi
          done
          echo "artifact matches the tag: $version"

      - name: Publish
        run: uv publish dist/*
