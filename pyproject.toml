[project]
name = "openroboto"
version = "0.1.0"
description = "OpenRoboto subnet (Bittensor netuid 80) CLI — everything a miner or external validator types."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenRoboto", email = "cameron@moonshotcommons.com" }]
keywords = ["bittensor", "openroboto", "subnet", "miner", "cli"]

# ⚠️ 3.11，不是 3.12。矿工机器上跑的就是 3.11
# （openpi-runner/Dockerfile 与 SETUP_NATIVE.md 都写死 python3.11）。
# 写 3.12 等于所有现有矿工装不上这个包。
requires-python = ">=3.11"

# 依赖要轻（AGENTS.md 红线 #4）。矿工只想提交模型，不该被迫装一堆东西。
# 这里每一条都有人在用：
#   openroboto-protocol —— commitment 编码 / checkpoint 格式判定，不许本地复制一份
#   pyyaml             —— miner.yaml
#   bittensor          —— 链交互（burn / commitment / set_weights）
#   huggingface_hub    —— 模型上传
# HTTP 一律用 stdlib urllib，不引 requests。
dependencies = [
    # 精确钉死，不是 `>=`。版本号**就是**契约版本：浮动范围意味着矿工侧和后端侧
    # 可能解析到不同的代码，而"两边能被证明装的是同一份"正是这个包唯一的存在理由。
    # `.github/workflows/protocol-guards.yml` 会检查这一条（只查有没有 `==`，
    # 具体版本对不对它管不了 —— 那要靠这里和协议包保持同步）。
    #
    # ⚠️ 这个号必须等于 `../openroboto-protocol/pyproject.toml` 的 version。
    # 曾经写成 `==1.0.0` 而协议包是 `0.2.0`：`[tool.uv.sources]` 的 path 覆盖
    # 会**绕过版本约束**，所以本地和 CI 全都是绿的，装进环境的其实是 0.2.0。
    # 等到发布前撤掉那段 path 覆盖、真从 PyPI 装，才会炸 —— 而那时正在发版。
    "openroboto-protocol==0.2.0",
    "pyyaml>=6.0",
    # 生产矿工机上跑的是 10.5.0（旧 requirements.txt 钉死这个版本）。
    # 用到的两个 API 是 SDK 私有面：`publish_metadata_extrinsic`（commitment）
    # 与 `substrate.compose_call("add_stake_burn")`（burn），大版本升级必然会动，
    # 所以上界锁在 11。
    "bittensor>=10.5,<11",
    "huggingface_hub>=0.24.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/openroboto-ai/openroboto-cli"
Issues = "https://github.com/openroboto-ai/openroboto-cli/issues"

[project.scripts]
openroboto = "openroboto.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

# 2026-08-19：`openroboto-protocol` 已发到 PyPI（0.1.0 / 0.2.0），
# 此处原有的 `[tool.uv.sources]` path 覆盖已删除 —— 现在从 PyPI 装，
# `uv sync` 不再需要同级的 openroboto-protocol/ 检出。
#
# ⚠️ 别把它加回来。那个覆盖会**绕过版本约束**：上面 `==0.2.0` 曾经写成
# `==1.0.0` 而本地检出是 0.2.0，本地和 CI 全绿，装进环境的其实是 0.2.0。
# 要临时对着未发布的协议包改动开发，用 `uv pip install -e ../openroboto-protocol`
# 显式覆盖，别写进 pyproject —— 那样至少是当次会话可见的，不会留在仓库里骗下一个人。

[dependency-groups]
dev = [
    "pytest>=7.4.3,<10.0.0",
    "coverage>=7.4.3,<8.0.0",
    "mypy>=1.8.0,<3.0.0",
    "ruff>=0.2.2,<1.0.0",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]
# 2026-08-19：旧结构（`rt.py` / `miner.py` / `validator.py` / `payment.py` /
# `utils/` / `protocol/` / `miner/` / `requirements.txt`）已整体删除，所以这里
# 不再需要为它们开豁免。**新增豁免要有理由** —— 一条 lint 豁免就是一块
# 永远不会被检查的代码。
extend-exclude = [
    # 训练镜像定义，不是 Python 包的一部分。
    "openpi-runner",
    "scripts",
    # 模板是在训练容器里跑的独立脚本（依赖 openpi / torch，本包不装它们），
    # 不参加本包的风格约束 —— 改它们的排版会让与容器侧的对照变难。
    "src/openroboto/templates",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20", "RUF"]
# 注释与 docstring 写中文，中文标点会被 RUF001-003 当作同形字逐个报出来，对本仓是纯噪音。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# CLI 就是要往 stdout 打字给矿工看，T20（print）在命令层不适用。
"src/openroboto/commands/*.py" = ["T20"]
"src/openroboto/console.py" = ["T20"]
# 模板是给矿工挂进容器的独立脚本，不参与本包的类型与风格约束。
"src/openroboto/templates/*" = ["T20", "B", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
# 只查新结构；旧文件与模板（模板在容器里跑，依赖 openpi/torch）不参加。
#
# 不查 `tests/`：pytest 的 stub 会把 numpy 拖进来，而 numpy 的 stub 用了 3.12 才有的
# `type` 语句 —— 我们按矿工侧的 3.11 检查，跟进去只会得到 numpy 自己的语法报错。
# 测试的正确性由 pytest 保证，不由类型检查保证。
files = ["src/openroboto"]
exclude = "src/openroboto/templates/"

[[tool.mypy.overrides]]
# bittensor / huggingface_hub / torch 不带类型信息，且矿工机以外的环境（CI、本机）
# 未必装得上 bittensor（它拖 torch）。所有链交互都在函数体内延迟 import，
# 这样 `openroboto check` / `init` / `status` 在没有 bittensor 的机器上也能跑。
#
# `follow_imports = "skip"` 是必需的：numpy 的 stub 用了 3.12 才有的 `type` 语句，
# 而我们按 3.11 检查（矿工侧的版本）—— 跟进去只会检出 numpy 自己的语法差异。
module = [
    "bittensor",
    "bittensor.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "torch",
    "torch.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# 门槛就是**实测值本身**，不是一个好看的整数，也不留余量 ——
# 留 5 个点等于允许覆盖率静默回退 5 个点，掉下去的正好是没人替它写测试的那部分。
# 数字看着怪是故意的：它是 `coverage run --source=src -m pytest` 今天跑出来的值。
#
# precision 必须写：默认 precision=0 时 coverage 拿**四舍五入后**的值和门槛比，
# 59.5% 会被舍成 60% 通过 —— 半个点的静默回退，正是这条门槛要拦的东西。
#
# 60% 不高，因为大量代码路径要真 GPU / 真链 / 真 Docker 才走得到（AGENTS.md §4：
# 那些只测参数拼装，不测真跑）。它的作用不是"证明测够了"，是"不许往下掉"。
fail_under = 63.17
precision = 2
show_missing = true
