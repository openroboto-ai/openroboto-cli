[project]
name = "openroboto"
version = "1.2.0"
description = "OpenRoboto subnet (Bittensor netuid 80) CLI — everything a miner or external validator types."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenRoboto", email = "cameron@moonshotcommons.com" }]
keywords = ["bittensor", "openroboto", "subnet", "miner", "cli"]

# ⚠️ 3.11, not 3.12. Miner machines run 3.11
# (both openpi-runner/Dockerfile and SETUP_NATIVE.md hardcode python3.11).
# Writing 3.12 means no existing miner can install this package.
requires-python = ">=3.11"

# Keep dependencies light (AGENTS.md red line #4). A miner only wants to submit a
# model and must not be forced to install a pile of things. Every entry here has a
# real user:
#   openroboto-protocol — commitment encoding / checkpoint format detection; a local
#                         copy is not allowed
#   pyyaml             — miner.yaml
#   bittensor          — chain interaction (burn / commitment / set_weights)
#   huggingface_hub    — model upload
# HTTP always goes through stdlib urllib; requests is not pulled in.
dependencies = [
    # Pinned exactly, not `>=`. The version number **is** the contract version: a
    # floating range means the miner side and the backend side may resolve to
    # different code, and "both sides can be proven to have installed the same
    # thing" is the only reason this package exists.
    # `.github/workflows/protocol-guards.yml` enforces this (it only checks that
    # `==` is present; whether the specific version is correct is beyond it — that
    # depends on keeping this in sync with the protocol package).
    #
    # ⚠️ This number must equal the version in `../openroboto-protocol/pyproject.toml`.
    # It was once written as `==1.0.0` while the protocol package was `0.2.0`: the
    # path override in `[tool.uv.sources]` **bypasses the version constraint**, so
    # local and CI were both green while what was actually installed was 0.2.0.
    # It only blows up once the path override is removed before a release and the
    # install really comes from PyPI — and that is exactly release time.
    "openroboto-protocol==0.9.0",
    "pyyaml>=6.0",
    # Production miner machines run 10.5.0 (the old requirements.txt pinned that
    # version). The two APIs used are private surface of the SDK:
    # `publish_metadata_extrinsic` (commitment) and
    # `substrate.compose_call("add_stake_burn")` (burn); a major version bump is
    # bound to move them, so the upper bound is locked at 11.
    "bittensor>=10.5,<11",
    "huggingface_hub>=0.24.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/openroboto-ai/openroboto-cli"
Issues = "https://github.com/openroboto-ai/openroboto-cli/issues"

[project.scripts]
openroboto = "openroboto.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

# 2026-08-19: `openroboto-protocol` is now published on PyPI (0.1.0 / 0.2.0), so the
# `[tool.uv.sources]` path override that used to live here has been deleted — the
# install comes from PyPI now, and `uv sync` no longer needs a sibling
# openroboto-protocol/ checkout.
#
# ⚠️ Do not add it back. That override **bypasses the version constraint**: the
# `==0.2.0` above was once written as `==1.0.0` while the local checkout was 0.2.0;
# local and CI were both green and what was installed was actually 0.2.0.
# To develop temporarily against unreleased protocol changes, use
# `uv pip install -e ../openroboto-protocol` as an explicit override; do not write it
# into pyproject — that way it is at least visible for that session only and does not
# stay in the repo to fool the next person.

[dependency-groups]
dev = [
    "pytest>=7.4.3,<10.0.0",
    "coverage>=7.4.3,<8.0.0",
    "mypy>=1.8.0,<3.0.0",
    "ruff>=0.2.2,<1.0.0",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]
# 2026-08-19: the old structure (`rt.py` / `miner.py` / `validator.py` / `payment.py` /
# `utils/` / `protocol/` / `miner/` / `requirements.txt`) was deleted wholesale, so no
# exemptions are needed for it here any more. **A new exemption must come with a
# reason** — one lint exemption is one block of code that will never be checked again.
extend-exclude = [
    "scripts",
    # The templates and the runner are both standalone scripts that run inside the
    # training container (they depend on openpi / torch, which this package does not
    # install); they do not take part in this package's style constraints — reformatting
    # them would make diffing against the container side harder.
    "src/openroboto/templates",
    "src/openroboto/runner",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20", "RUF"]
# Comments and docstrings contain CJK text, and CJK punctuation gets reported one by
# one by RUF001-003 as ambiguous characters, which is pure noise for this repo.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The CLI is meant to print to stdout for miners to read, so T20 (print) does not
# apply at the command layer.
"src/openroboto/commands/*.py" = ["T20"]
"src/openroboto/console.py" = ["T20"]
# Templates and container-side scripts take part in neither the type nor the style
# constraints of this package (see the note in [tool.mypy]).
"src/openroboto/templates/*" = ["T20", "B", "RUF"]
"src/openroboto/runner/*" = ["T20", "B", "RUF", "E", "UP", "I"]
# The release-gate script's whole output is a progress report on stdout, same as
# the command layer. Listed here so it stays clean if the lint scope ever widens
# past `src tests` -- today `scripts/lint.sh` does not reach it.
"scripts/*.py" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.11"
# Only the new structure is checked; old files and templates (templates run inside the
# container and depend on openpi/torch) are out.
#
# `tests/` is not checked. ⚠️ The reason written here used to be "numpy's stubs use
# the `type` statement that only exists in 3.12" — **that expired.** Measured
# 2026-08-21: `mypy src tests` runs clean of numpy errors and reports 11 findings,
# none of which is a bug:
#
#   - 7 × "does not explicitly export attribute" on `monkeypatch.setattr(mod, ...)`.
#     Patching the *importing* module is the correct idiom (the module holds its own
#     reference), so `no_implicit_reexport` is wrong about these, not the tests.
#   - 4 × noise mypy cannot narrow: `**kwargs` from a heterogeneous dict literal,
#     `parser._subparsers` (already carrying an ignore).
#
# So it stays out on cost/benefit, not on impossibility. And note what it would
# **not** buy: `monkeypatch.setattr(mod, "name", v)` takes the attribute as a
# *string*, so a patch aimed at an attribute that has moved away is invisible to
# mypy — that class of bug (a test that silently stops taking effect and starts
# hitting the real network) needs a real call, not a type checker.
files = ["src/openroboto"]
# `runner/train_runner.py` also runs inside the container (openpi / torch, which this
# package does not install), same category as the templates: it ships with the package
# so that `openroboto build` works offline, not so that it takes part in this package's
# type constraints. It imports stdlib only, and the container side's correctness is
# guaranteed by the container actually running.
exclude = "src/openroboto/(templates|runner)/"

[[tool.mypy.overrides]]
# bittensor / huggingface_hub / torch ship no type information, and environments other
# than miner machines (CI, a dev laptop) may not even be able to install bittensor (it
# drags torch in). All chain interaction is imported lazily inside function bodies, so
# that `openroboto check` / `init` / `status` also run on machines without bittensor.
#
# `follow_imports = "skip"` is required: numpy's stubs use the `type` statement that
# only exists in 3.12, while we check against 3.11 (the miner side's version) —
# following them in would only surface numpy's own syntax differences.
module = [
    "bittensor",
    "bittensor.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "torch",
    "torch.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# The threshold is **the measured value itself**, not a good-looking round number, and
# no slack is left — leaving 5 points means allowing coverage to silently regress by 5
# points, and what drops out is exactly the part nobody wrote a test for.
# The number looking odd is deliberate: it is what
# `coverage run --source=src -m pytest` produced today.
#
# precision must be set: with the default precision=0, coverage compares the **rounded**
# value against the threshold, so 59.5% would be rounded up to 60% and pass — half a
# point of silent regression, which is exactly what this gate is here to stop.
#
# 60% is not high, because a large number of code paths are only reachable with a real
# GPU / real chain / real Docker (AGENTS.md §4: those only test argument assembly, not
# a real run). Its purpose is not to "prove there are enough tests", it is "must not
# go down".
# Sits on the measured value: 79.91 as of the three silent-fallback gates -- the burn
# that requires this run's competition verdict, the build that will not fill one
# competition's image name with another's contents, and the adapters that say
# "cannot train" out loud (2026-08-26, up from 79.52, 73.34 and 73.14). Slack between
# the gate and reality is not safety margin, it is permission for exactly that many
# points of silent regression. Raise it whenever a real run comes in higher.
#
# 80.04 as of dropping the base_repo precheck (2026-09-01). It went down because
# the deleted branch was covered; the test that covered it now asserts the
# opposite and is two lines shorter.
#
# 80.06 as of the season's addresses moving out of the runner's constants
# (2026-08-31). It went *down* first: `_addressed()` is the only new line in
# `runner/lingbot/train_runner.py` that a machine with no GPU can reach, and
# that file is 21% covered, so adding it unmeasured cost more than the CLI-side
# tests paid back. The gate caught it -- which is the whole point of no slack.
#
# ⚠️ **Measure it the way CI does**: `coverage run --source=src -m pytest`.
# Plain `coverage run -m pytest` counts tests/ into the denominator, and tests are
# ~100% covered by construction, so it reports about 12 points higher — 82.38 rather
# than 70.26. That number was briefly committed here and CI rejected the very commit
# that introduced it. The gate is not the place to find out you measured differently.
fail_under = 80.04
precision = 2
show_missing = true
