# A miner.yaml from before competitions existed.
#
# 🔴 **Do not add a field to this file.** Its whole job is to be the config a
# miner wrote months ago and has not touched since: no `competition:` section,
# no `id`, no `track`. Every key below already existed in the config template
# that shipped with `rt.py`.
#
# `tests/test_backward_compat.py` runs the one remaining legacy step against it
# (`perform_announce` -- `announce` stopped being a command in 1.0) and compares
# the bytes with the baseline recorded on protocol 0.6.0. Adding a field here
# would silently move what that comparison is comparing.

environment: mainnet

subnet:
  network: finney
  netuid: 80
  wallet_path: ~/.bittensor/wallets
  coldkey: default
  hotkey: default
  hotkey_ss58: 5MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM

model:
  vla_model_id: pi05
  vla_checkpoint_path: ""

huggingface:
  token: hf_legacy_token_not_a_real_one
  username: legacyminer

payment:
  burn_rate_tao: 0.1

log_level: INFO
log_dir: logs
